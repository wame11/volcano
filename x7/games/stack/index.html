<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Stack Tower</title>
<style>
html,body{margin:0;height:100%;background:#0b0f1a;color:#e8ecf5;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:10px;box-shadow:0 0 0 2px #1d2540,0 20px 60px rgba(0,0,0,.6)}
</style>
</head>
<body><canvas id="c"></canvas>
<script>
(() => {
const W = 400, H = 640, BH = 30, BASE_W = 220;
const cv = document.getElementById('c'), ctx = cv.getContext('2d'); cv.width = W; cv.height = H;
function fit() { const s = Math.min(innerWidth / W, innerHeight / H) * 0.98; cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
const HI = 'rb_stack_hi'; let hi = +localStorage.getItem(HI) || 0;
let blocks, cur, falling, score, state, camY, camTarget, speed, hue, perfectT, shake;
function reset() { hue = Math.random() * 360; blocks = [{ x: (W - BASE_W) / 2, w: BASE_W, hue }]; falling = []; score = 0; camY = 0; camTarget = 0; speed = 190; perfectT = 0; shake = 0; state = 'ready'; spawn(); }
function spawn() { hue = (hue + 9) % 360; const top = blocks[blocks.length - 1]; const fromLeft = blocks.length % 2 === 1; cur = { x: fromLeft ? -top.w : W, w: top.w, hue, dir: fromLeft ? 1 : -1 }; }
function topY(i) { return H - 120 - i * BH; }
let ac = null; function beep(f, d, type) { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'square'; o.frequency.value = f; g.gain.value = 0.07; g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) { } }
function drop() {
  if (state === 'ready') { state = 'play'; }
  if (state === 'over') { reset(); return; }
  if (state !== 'play') return;
  const top = blocks[blocks.length - 1]; const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w); const overlap = right - left;
  if (overlap <= 0) { falling.push({ x: cur.x, w: cur.w, y: topY(blocks.length), hue: cur.hue, vy: 0, vr: (Math.random() - 0.5) * 3, r: 0 }); state = 'over'; shake = 0.4; beep(110, .5, 'sawtooth'); if (score > hi) { hi = score; localStorage.setItem(HI, hi); } return; }
  const off = cur.x - top.x;
  if (Math.abs(off) < 5) { blocks.push({ x: top.x, w: Math.min(BASE_W, top.w + 4), hue: cur.hue }); perfectT = 0.6; score += 2; beep(880 + Math.min(600, score * 10), .12); beep(1320, .1); }
  else { if (off > 0) falling.push({ x: right, w: cur.x + cur.w - right, y: topY(blocks.length), hue: cur.hue, vy: 0, vr: 2, r: 0 }); else falling.push({ x: cur.x, w: left - cur.x, y: topY(blocks.length), hue: cur.hue, vy: 0, vr: -2, r: 0 }); blocks.push({ x: left, w: overlap, hue: cur.hue }); score += 1; beep(440, .06); }
  speed = Math.min(420, 190 + blocks.length * 7); camTarget = Math.max(0, (blocks.length - 6) * BH); spawn();
}
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown') { e.preventDefault(); drop(); } });
cv.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
function update(dt) {
  if (state === 'play') { cur.x += cur.dir * speed * dt; if (cur.x + cur.w > W + 10) { cur.dir = -1; } if (cur.x < -10) { cur.dir = 1; } }
  camY += (camTarget - camY) * Math.min(1, dt * 6); if (perfectT > 0) perfectT -= dt; if (shake > 0) shake -= dt;
  for (let i = falling.length - 1; i >= 0; i--) { const f = falling[i]; f.vy += 900 * dt; f.y += f.vy * dt; f.r += f.vr * dt; if (f.y - camY > H + 100) falling.splice(i, 1); }
}
function block(x, y, w, hue, alpha) { ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.fillStyle = `hsl(${hue},70%,55%)`; ctx.fillRect(x, y, w, BH); ctx.fillStyle = `hsl(${hue},70%,68%)`; ctx.fillRect(x, y, w, 5); ctx.fillStyle = `hsl(${hue},70%,40%)`; ctx.fillRect(x + w - 6, y, 6, BH); ctx.globalAlpha = 1; }
function draw() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `hsl(${(hue + 180) % 360},35%,12%)`); g.addColorStop(1, '#0b0f1a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); if (shake > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8); ctx.translate(0, camY);
  for (let i = 0; i < blocks.length; i++) block(blocks[i].x, topY(i), blocks[i].w, blocks[i].hue);
  for (const f of falling) { ctx.save(); ctx.translate(f.x + f.w / 2, f.y + BH / 2); ctx.rotate(f.r); block(-f.w / 2, -BH / 2, f.w, f.hue, 0.9); ctx.restore(); }
  if (state === 'play' || state === 'ready') block(cur.x, topY(blocks.length), cur.w, cur.hue);
  ctx.restore();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.font = 'bold 56px system-ui,sans-serif'; ctx.fillText(score, W / 2, 70);
  ctx.font = '15px system-ui,sans-serif'; ctx.fillStyle = '#c9d2e8'; ctx.fillText('BEST ' + hi, W / 2, 112);
  if (perfectT > 0) { ctx.fillStyle = '#ffd166'; ctx.font = 'bold 22px system-ui,sans-serif'; ctx.globalAlpha = Math.min(1, perfectT * 3); ctx.fillText('PERFECT!', W / 2, 150); ctx.globalAlpha = 1; }
  if (state === 'ready') { ctx.fillStyle = '#fff'; ctx.font = 'bold 30px system-ui,sans-serif'; ctx.fillText('STACK TOWER', W / 2, H / 2 - 40); ctx.font = '16px system-ui,sans-serif'; ctx.fillStyle = '#c9d2e8'; ctx.fillText('Tap, click or press Space to drop the block', W / 2, H / 2); ctx.fillText('Line it up exactly for a PERFECT bonus', W / 2, H / 2 + 26); }
  if (state === 'over') { ctx.fillStyle = 'rgba(5,8,16,.6)'; ctx.fillRect(0, H / 2 - 70, W, 140); ctx.fillStyle = '#ff5c7a'; ctx.font = 'bold 32px system-ui,sans-serif'; ctx.fillText('TOWER FELL', W / 2, H / 2 - 24); ctx.fillStyle = '#fff'; ctx.font = '17px system-ui,sans-serif'; ctx.fillText('Height ' + score + (score >= hi && score > 0 ? '  ·  New best!' : '  ·  Best ' + hi), W / 2, H / 2 + 12); ctx.fillStyle = '#c9d2e8'; ctx.font = '14px system-ui,sans-serif'; ctx.fillText('Tap or Space to try again', W / 2, H / 2 + 42); }
}
let last = performance.now();
function loop(now) { requestAnimationFrame(loop); const dt = Math.min(0.033, (now - last) / 1000); last = now; update(dt); draw(); }
reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
